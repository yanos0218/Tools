name: CI

# 문서(markdownlint)와 n2sf-hardening 스크립트(문법·shellcheck·회귀 테스트)를 검사한다.
# 스크립트 대상이 Ubuntu 24.04(amd64)라 같은 환경인 ubuntu-24.04 러너에서 돌린다.
# push는 main만, 브랜치 작업은 PR 이벤트로만 — 같은 커밋이 두 번 돌지 않게.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: 문서 (markdownlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: |
            **/*.md

  n2sf-hardening:
    name: n2sf-hardening (문법·shellcheck·회귀 테스트)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: 문법 검사 (bash -n)
        run: |
          for f in n2sf-hardening/*.sh n2sf-hardening/tests/*.sh; do
            echo "bash -n $f"; bash -n "$f"
          done

      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          shellcheck --version | sed -n 2p
          cd n2sf-hardening
          shellcheck -S warning n2sf_u2404_hardening.sh install_apt_hook.sh make_pwq_bundle.sh
          # 테스트 스크립트의 ls 반복(SC2010·SC2045)은 알려진 개선 대상이라 임시로 제외한다
          shellcheck -S warning -e SC2010,SC2045 tests/run_tests.sh

      # 스크립트는 root 소유 설정 파일만 받으므로 root 소유 복사본으로 시험한다.
      # 일회용 러너라 /root/n2sf_hardening 에 결과가 남아도 무방하다.
      - name: 회귀 테스트 (root)
        run: |
          sudo rm -rf /opt/n2sf && sudo mkdir -p /opt/n2sf
          sudo cp -a n2sf-hardening/. /opt/n2sf/
          sudo chown -R root:root /opt/n2sf
          sudo chmod 755 /opt/n2sf /opt/n2sf/tests
          sudo chmod 700 /opt/n2sf/*.sh /opt/n2sf/tests/run_tests.sh
          sudo chmod 600 /opt/n2sf/n2sf_hardening.conf
          sudo bash /opt/n2sf/tests/run_tests.sh
