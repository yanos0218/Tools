name: docs

# 저장소 전체 문서(markdownlint). 도구별 검사는 도구 이름의 워크플로(예: vulnerability.yml)가 맡는다.
# push는 main만, 브랜치 작업은 PR 이벤트로만 — 같은 커밋이 두 번 돌지 않게.
on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.markdownlint.jsonc'
      - '.github/workflows/docs.yml'
      - '.github/scripts/check_links.py'
      - '.github/scripts/check_changelog.py'
  pull_request:
    paths:
      - '**/*.md'
      - '.markdownlint.jsonc'
      - '.github/workflows/docs.yml'
      - '.github/scripts/check_links.py'
      - '.github/scripts/check_changelog.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 태그 시점의 CHANGELOG와 비교하려면 태그가 필요함

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: |
            **/*.md

      # 상대 경로 링크가 실제 파일을 가리키는지 확인(markdownlint는 이걸 보지 않음)
      - name: 링크 검사
        run: python3 -I .github/scripts/check_links.py

      # 릴리즈된 CHANGELOG 섹션이 태그 시점과 같은지 확인(새 항목은 [Unreleased]에만, #51)
      - name: CHANGELOG 릴리즈 섹션 불변 검사
        run: python3 -I .github/scripts/check_changelog.py
